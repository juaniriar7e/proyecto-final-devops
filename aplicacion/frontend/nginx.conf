# Configuracion del contenedor frontend. El ruteo /api lo hace el ALB o el gateway, no esta capa.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Health check del ALB y de Docker.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Version del frontend: sin cache para que siempre refleje el contenedor en ejecucion.
    location = /version.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        try_files /version.json =404;
    }

    # Assets con hash en el nombre: cache larga.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # SPA: cualquier otra ruta devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
