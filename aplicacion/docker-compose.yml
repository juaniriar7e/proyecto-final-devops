# Entorno local con el mismo ruteo que el ALB de AWS.
# Uso: docker compose up -d --build  ->  http://localhost:8081
services:
  backend:
    build:
      context: ./backend
    environment:
      APP_VERSION: ${APP_VERSION:-local}
    # Sin TASKS_TABLE: el backend guarda las tareas en memoria.
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
    environment:
      APP_VERSION: ${APP_VERSION:-local}
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true

  gateway:
    image: nginxinc/nginx-unprivileged:1.31-alpine
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
